# Copy to /volume2/docker/hermes/data/phoebe-state/conventions.yaml on the NAS and fill in.
# The real file is not committed (it's in .gitignore). The pco server reads it through
# PCO_CONVENTIONS_FILE for the Sunday readiness check, and never guesses beyond it.

service_type_name: "Sunday Morning"      # exactly as list_service_types shows it
time_zone: "America/Denver"              # "this Sunday" and "first Sunday" are worked out in this zone

plan:
  # How the plan title is written. Must capture `passage` and `title`.
  # This pattern reads "John 3:1-8 | You Must Be Born Again".
  title_pattern: '^(?P<passage>.+?)\s*\|\s*(?P<title>.+)$'

sermon_item:
  # How the sermon item's title is written. Must capture `passage`, `title`, and `preacher`.
  # This pattern reads "John 3.1-8 | You Must Be Born Again | Pat Doe".
  title_pattern: '^(?P<passage>.+?)\s*\|\s*(?P<title>.+?)\s*\|\s*(?P<preacher>.+)$'
  must_match_plan_title: [passage, title]   # flag when these differ from the plan title

scripture_reading_item:
  # Optional. This pattern reads "Scripture Reading: John 3:1-8".
  title_pattern: '^Scripture Reading:\s*(?P<passage>.+)$'

songs:
  item_type: song
  title_must_be_quoted: true             # straight "..." or curly quotes both count

# The positions the service can't run without, by their exact Planning Center names. The
# report lists who is in each one, in this order ("• Preacher: Pat Doe"), and says "nobody yet"
# for an empty one. It never says who has or hasn't accepted, and no other position appears.
required_positions:
  - "Preacher"
  - "Service Leader"
  - "Scripture Reader"
  - "Music Leader"

preacher_position: "Preacher"            # whose person must match the sermon item and the schedule sheet

communion:
  required_on: first_sunday              # leave the section out if communion isn't tied to a date
  title_contains_any: ["Communion", "Lord's Supper"]

# Short name -> Planning Center name, only where the built-in rule can't match. Used for the
# schedule sheet and for the preacher named in the sermon item.
# The rule: first names must be exactly equal ("Pat" = "Pat Doe"), and a last initial, if
# the sheet gives one, must match ("Sam R" = "Sam Roe"). Planning Center reports the name on
# the person's record, so a "Patricia Doe" who is written "Pat" everywhere else needs a line.
# With it, "Pat" means that one person: "Patricia Doe" or "Pat Doe", and no other Pat, and the
# report shows that person as "Pat Doe".
preacher_aliases: {}
#  Pat: "Patricia Doe"

# How Sunday sermons are listed on SermonAudio, for the listing check (Job D). All optional;
# these are the values the check uses when the block is left out.
sermonaudio:
  fix_listings: false          # true lets Phoebe correct the listing's title, Bible text, and speaker
                               # herself when the plan title and sermon item agree and the listing
                               # differs. Read on every run, so turning it off needs no restart.
  event_type: "Sunday Service" # the SermonAudio category Sunday sermons are filed under
  title_pattern: '^(?P<passage>.+?)\s*\|\s*(?P<title>.+)$'   # "Genesis 4:17-5:32 | Seeds of Sin & Hope"
