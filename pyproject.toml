[project]
name = "pco-mcp"
version = "0.1.0"
description = "MCP server for Planning Center Online (Services) — schedule tech/AV teams for worship services"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
pco-mcp = "pco_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pco_mcp"]
